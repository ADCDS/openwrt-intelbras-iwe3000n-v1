# wpa_supplicant.conf -- the network this board joins in CLIENT mode.
#
# CHANGE THIS to your network. The values below are a placeholder, not a real
# network. In client mode S90wifi runs:
#   wpa_supplicant -B -i wlan0 -c /etc/wpa_supplicant.conf
#   udhcpc -i wlan0
#
# For a runtime/persistent override without rebuilding, put a file at
# /userdata/wpa_supplicant.conf (used first if /userdata is writable).
ctrl_interface=/var/run/wpa_supplicant
update_config=1

network={
	ssid="YOUR_SSID"
	psk="YOUR_PASSPHRASE"
	key_mgmt=WPA-PSK
	scan_ssid=1
}
