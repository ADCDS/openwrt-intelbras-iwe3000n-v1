# udhcpd -- DHCP server for the IWE 3000N's AP (wlan0). The AP is 192.168.50.1;
# this hands clients .100-.200 so they no longer need a static address.
# Leases live in RAM (/tmp) because the rootfs is read-only.
interface	wlan0
start		192.168.50.100
end		192.168.50.200
max_leases	100
option	subnet	255.255.255.0
option	router	192.168.50.1
option	dns	192.168.50.1
option	lease	43200
lease_file	/tmp/udhcpd.leases
