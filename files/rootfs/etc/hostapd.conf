# Bench AP for the IWE 3000N (M5). 2.4 GHz only -- this board has one radio.
#
# The PSK below is a BENCH CREDENTIAL in a public-ish repo. Change it before
# this device is anywhere real, along with the root password (see
# files/rootfs/README.md).
interface=wlan0
driver=nl80211
ssid=IWE3000N-test
country_code=BR
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=iwe3000n-bench

# No control interface directory on a read-only rootfs; put it in RAM.
ctrl_interface=/var/run/hostapd
